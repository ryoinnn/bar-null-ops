[project]
name = "barnull"
version = "0.1.0"
description = "Bar null レンタルスペース予約対応の自動化（スペースマーケット／インスタベース × Slack）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "aiohttp>=3.10",
    "playwright>=1.48",
    "apscheduler>=3.10,<4",
    "keyring>=25",
    "tzdata>=2024.1",
]

[project.scripts]
barnull = "barnull.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barnull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
