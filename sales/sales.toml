# 売上管理の設定（秘密情報は書かない。秘密は Secret Manager / この PC では資格情報マネージャー）
# 変更したら GitHub の main に push する（Cloud Build がテストしてデプロイする）。環境変数で上書きできるのは DRY_RUN だけ

dry_run = false                # true: Slack はテスト用チャンネル、Asana はテスト用プロジェクトに書く（2026-10-17 本番に切り替え）

[gcp]
project = "barnull-sales"
region = "us-central1"
tasks_queue = "sales-events"
tasks_max_attempts = 10        # Cloud Tasks のキューの最大試行回数（infra/setup.py base と同じ値）。最後の試行で失敗したら Slack に知らせる
invoker_sa = "sales-invoker@barnull-sales.iam.gserviceaccount.com"
worker_url = "https://sales-worker-752274rfja-uc.a.run.app"   # sales-worker の URL（サービスを作り直さない限り変わらない）

[business]
timezone = "Asia/Tokyo"
day_start = "06:00"            # 6:00〜翌6:00 を1営業日とする

[line]
bot_mention_name = "@null"     # Bot の表示名（2026-10-17 時点）。メンション情報が付かない手打ちの場合に使う
# 処理するグループ。Bot が参加したとき（または未登録のグループで @Bot が送られたとき）に Slack に ID が出るので、それを入れる
allowed_group_ids = [
    "C1677918dcaced99186836b5cb2dfb9bb",  # 本番「Bar null」（2026-10-17 招待）
    # テスト用「てすと」C36fd8992ec772db9dfb7976e9d4cf58f は本番化で外した
]
reply_ack = true               # 受け付けた @Bot メッセージに、引用付きの「OK」スタンプを返す（2026-10-18 本人の希望）

[slack]
channel_prod = "C0C96EJ013J"   # #daily_barnull-sales（旧 #barnull-sales。2026-10-17 に名前変更、ID は同じ）
channel_test = "C0C8E1NLRAM"   # #test_barnull-sales
alert_mention = "U0A51TDCCEN"  # 桝本
monitor_channel_prod = "C0CHSLZA8RY"  # #null_system-monitor（公開。2026-11-15 作成）。外部API障害・処理エラー。投稿できなければ channel_prod に出す
report_channel_prod = "C0C9KTM1R0X"  # #weekly_barnull-sales（売上週報の通知先。空なら channel_prod。DRY_RUN 中はテスト用チャンネル）

[asana]
workspace = "1211486340364770" # 0x0.co.jp
team_name = "0x0 Inc."
project_name_prod = "Bar null 売上管理（伝票）"
project_name_test = "Bar null 売上管理（伝票）［テスト］"
# プロジェクト・セクション・カスタムフィールドの ID は asana_ids.json（barnull-sales asana-setup が書く）

[square]
merchant_id = "MLW68WPW3T15S"
location_id = "L7SVX8VVWDQBX"  # Bar null だけを対象にする（SPICE DRINK の LD7FS4BS4298P は扱わない）
payment_grace_min = 60         # 送信からこの時間たっても決済が見つからなければ「決済未確認」
payment_retry_days = 7         # 見つからなくても、送信からこの日数は探し続ける（2026-10-25 3→7）
payment_window_extra_days = 1  # 営業日の範囲（6:00〜翌6:00）で見つからなければ、さらにこの日数先まで探す（2026-10-25 本人）
split_max = 5                  # 割り勘とみなす決済の最大件数
split_span_min = 30            # 割り勘とみなす決済の時間の幅
orphan_grace_hours = 6         # 決済の営業日が終わってから、伝票の無い決済として知らせるまで
orphan_check_since = "2026-10-17T19:23:00+09:00"  # これより前の決済は「伝票の無い決済」として扱わない（本番化した日時）
oauth_enabled = false          # Square の許可をやり直すときだけ true にして push（運用手順書）。終わったら false に戻す

[mf]
office_code = "0356-4399"
# 三井住友（Square の振込が入る口座）の connected_sub_account_id。口座番号は書かない
bank_subaccount = "qugY1Ry%2B5wIAdbHNByb%2BP58jzj1eIfaOxLF90FVljSQ%3D"
square_patterns = ["スクエア(カ", "ｽｸｴｱ(ｶ"]
fetch_interval_hours = 3
# 現金を振り込む担当者の、通帳に出る名義（カナ）。空のあいだは現金の自動照合をしない（本人から後日共有）
staff_bank_names = []

[deposit]
grace_bizdays = 3              # 着金予定日からこの営業日数を過ぎても入金が無ければ「入金未確認」
cash_window_days = 14          # 現金の決済からこの日数以内の振込と照合する

[followup]
unpaid_reminder_interval_days = 7   # 未収のリマインドの間隔（起票日から）
correction_window_hours = 24        # 訂正を当てる伝票の範囲（送った人の、この時間以内の伝票）
event_retention_days = 30           # 受け取ったイベントの記録を残す日数
payer_match_confidence = 0.8        # 振込名義と顧客名が同じ人だと判定する確信度

[report]
artifact_url = "https://claude.ai/artifact/8BynYgvNxC4UyCQVGRUDnC"   # 売上レポート（週次）。週報の通知に載せる

[monitor]
# 外部監視（GitHub Actions の system-monitor）が動いているかを、reconcile のステップ monitor_watch で確かめる（相互監視）
watch_repo = "ryoinnn/bar-null-ops"

# 期限のある秘密情報（null システム全体。毎日のステップ secret_expiry が 30日前・7日前・前日・期限切れの時点で
# #null_system-monitor に知らせる）。期限は秘密ではないので日付だけを持つ。キー本体はここに書かない。
# 鍵を発行し直したら expires を新しい期限に書き換えて push する。期限の無い鍵は載せない（runbook「システム監視」）
[[monitor.expiry]]
name = "売上管理の Claude API キー（Anthropic Console、Default ワークスペース）"
expires = "2027-11-22T04:00:00+09:00"   # 2026-11-15 発行（前のキーは 2026-11-09 に切れ、11/10 からの伝票が失敗した）
renew = "Anthropic Console で新しいキーを発行 → `uv run python sales/scripts/set_secret.py ANTHROPIC_API_KEY` → `uv run python sales/infra/setup.py secrets deploy` → この expires を書き換えて push"

[claude]
model_primary = "claude-haiku-5-5"
model_fallback = "claude-sonnet-5-5"
effort = "low"

[labor]
# 勤怠・スタッフ台帳・給与（docs/profit/labor_requirements.md、labor_design.md）
enabled = true
dry_run = false                # 2026-11-15 本番の LINE で確認して本番化（true: 勤怠・台帳・給与はテスト用の Asana と #test_barnull-sales に書く）
slack_channel_prod = "C0CHSHBBDC2"  # #null_staff-management（非公開。2026-11-15 作成）
cycle_start = "21:00"          # 勤怠サイクル 21:00〜翌9:00（日付はサイクルの開始日）
cycle_end = "09:00"
deadline_extra_days = 1        # 営業日 D の勤務は D+2 日の 9:00 まで。過ぎたら桝本の承認待ち
max_shift_hours = 15
payroll_weekday = 2            # 翌月の第1水曜（0=月）
payroll_time = "17:00"         # に前月分の給与を計算
confirm_day = 10               # 10日
confirm_time = "09:00"         # に確定
payroll_since = "2026-11"      # この月より前の給与は計算しない（2026-11-23 本人の指示で 11月分から。勤怠の記録が無い 11/1〜20 の時給分は本人が調整額で足す）

[purchase]
# 仕入（NOS の仕入実績一覧 → Asana「Bar null 仕入」。docs/profit/purchasing_requirements.md）。本人の PC で毎週月曜 9:30 に実行
dry_run = false                # true: テスト用の Asana と #test_barnull-sales に書く（2026-11-15 本人の了承で本番に切り替え）
initial_since = "2026-08-01"   # 初回（purchase-fetch --initial）に読む期間の始まり
model = "claude-haiku-5-5"     # 商品名の表示名を作るモデル（Haiku の最新版。2026-11-15 本人指定）。取得そのものは Claude を使わない
slack = false                  # 取り込みの結果を Slack に知らせない（2026-11-15 本人）。失敗・要確認は PC の通知と samples/purchases/last_result.txt

[supplies]
# 備品・消耗品（マネフォのカード「BAR NULL」→ Asana「Bar null 備品消耗品」。docs/profit/supplies_requirements.md）。
# reconcile ジョブの中で3時間に1回だけマネフォを読む。dry_run のあいだはテスト用の Asana と #test_barnull-sales に書く
enabled = true                 # 2026-11-15 本人了承で有効化（本番の Asana「Bar null 備品消耗品」に書く）
dry_run = false
card_subaccount = "518TUq5pUSF1n9YvZABV1wudLT9L8bFtUEvHGvEo%2BYo%3D"           # マネフォの connected_sub_account_id（カード番号は書かない。supplies-setup のあとに設定）
backfill_from = "2026-08-01"   # 初回に読む期間の始まり
lookback_days = 60
exclude_patterns = ["NIGITA", "ニギタ"]   # 摘要にこれを含む明細は対象外（NIGITA は仕入に入る）
tool_patterns = ["ANTHROPIC", "OPENAI", "CHATGPT", "SLACK", "GITHUB", "NOTION", "ADOBE", "GOOGLE", "SHUTTERSTOCK"]   # 区分を「ツール・サブスク」にする
high_value = 100000            # この額以上の1件を「高額」とする（ポータルに件数が出る）
notify = false                 # 取り込みの結果を Slack に知らせない（2026-11-15 本人。失敗だけは既存の障害通知が知らせる）

[investor_report]
# 出資者向けの月次損益計算書（docs/investor_report.md）。毎日のジョブ（10:05）が 10日以降に前月分を PDF にし、
# 下のフォルダに置いて #null_system-monitor に URL を知らせる（メンションなし）。フォルダには sales-worker のサービスアカウントの書き込み権限が要る
enabled = false
drive_folder_id = "1NK0lsgaYapHLPUhsoy1GGCPrS7sQOj6g"   # 共有ドライブ「01_飲食店事業部」の「5_出資者報告/出資者向け_月次損益計算書（Bar null）」（2026-11-23 作成）
issue_day = 10                 # 給与の確定（10日 9:00）のあと
renotify_days = 3
company = "株式会社0x0（サザン代官山）"
