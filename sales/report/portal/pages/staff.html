<!-- コスト管理：スタッフ管理（担当: B（人件費・スタッフ管理））。index.html の殻が fetch して差し込む。
     データ: Asana の「Bar null 勤怠」「Bar null スタッフ台帳」「Bar null 給与」（非公開。docs/profit/contract.md §2）と伝票を、開いた人の Asana コネクタで読む。
     画面: 左のサイドバーで期間（年 → 月 → 週）を選ぶ。全体（売上とコスト・平均・スタッフ／プロモーター別）→ 個人（勤務条件・ダッシュボード・
     勤務日の一覧・AI の示唆）／給与（月ごとの一覧）。
     期間の数字: 売上は伝票（プロモーターフラグがあればその人、無ければ送った人）、コストは 時給の額（勤怠）＋ 売上 × バック率。
     月の給与の記録（見込み・計算済み・確定）がある月は、その記録の値（調整額を含む）を使う。
     台帳の入力: Asana の update_tasks（ポータルの capabilities に宣言が要る。無ければ「Asana で編集」のリンク）。
     約束: id は「staff-」で始める／ページだけのスタイルは .pg-staff の下／script は type="module"。 -->

<script type="module">
/* ======================= 設定（docs/profit/contract.md §2。読むプロジェクトの ID・環境・Asana の読み書きは common.js の BN） ======================= */
const BN = window.BN;
// 台帳の欄（書き込みに使う。カスタムフィールドの gid はワークスペース共通）
const F = { real: "1220538844483838", line: "1220538739161116", kind: "1220538692870113", joined: "1220538692871045",
            wage: "1220538672971380", wageFrom: "1220538692881961", rate: "1220538739255903" };
const KIND_OPT = { "スタッフ": "1220538692870114", "プロモーター": "1220538692870115", "管理者": "1220538692870116" };
const KINDS = ["スタッフ", "プロモーター"];
// 読み込みで必ず要る項目（無ければ 0 円と出さずに、読み込みの失敗にする）
const REQUIRED = {
  ledger: ["スタッフID", "区分"],
  attendance: ["稼働日", "勤怠ステータス", "店舗", "スタッフID", "時給の額"],
  payroll: ["対象月", "給与", "スタッフID"],
  slips: ["営業日", "伝票金額", "伝票ステータス", "担当（LINE）"],
};

const $ = (id) => document.getElementById(id);
const use = (name) => (window.claude && window.claude.use) ? window.claude.use(name) : Promise.resolve(null);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
const state = {
  tab: "overview", sid: null, sel: null, openYears: {},
  data: null,      // { env, staff, att, pay, slips, at }。env は読み込んだときの環境（表示・保存・示唆のキーはこれを使う）
  ver: null,       // 最後に読み込みを始めたときの BN.version()
  busy: false,     // 保存中
  flash: null,     // 保存の結果（{ sid, text }）。読み直しの再描画のあとに1回だけ出す
  mcp: null, db: null, sample: undefined, canWrite: null, insights: {}, aiRun: null,
};

/* ======================= 小さな道具 ======================= */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;      // 固定の SVG だけに使う
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const yen = (v) => v == null ? "—" : "¥" + Math.round(v).toLocaleString("ja-JP");
const short = (v) => v >= 10000 ? "¥" + (v / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 1 }) + "万" : yen(v);
const hrs = (v) => v == null ? "—" : (Math.round(v * 100) / 100).toLocaleString("ja-JP") + "h";
const pct = (v) => v == null || !isFinite(v) ? "—" : (Math.round(v * 1000) / 10).toLocaleString("ja-JP") + "%";
const times = (v) => v == null || !isFinite(v) ? "—" : (Math.round(v * 10) / 10).toLocaleString("ja-JP") + "倍";
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const avg = (a) => a.length ? sum(a, (x) => x) / a.length : null;
const hm = (iso) => iso ? iso.slice(11, 16) : "";

/* ---------- 日付と期間（売上管理と同じ: 週は月曜〜日曜、月をまたぐ週は月で区切る） ---------- */
const toD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const toS = (d) => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return toS(d); };
const monday = (s) => add(s, -((toD(s).getUTCDay() + 6) % 7));
const md = (s) => { const d = toD(s); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const dayLabel = (s) => `${md(s)}（${"日月火水木金土"[toD(s).getUTCDay()]}）`;
const ym = (s) => s.slice(0, 7);
const monthEnd = (s) => { const d = toD(s.slice(0, 8) + "01"); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return toS(d); };
const addMonths = (m, n) => { const d = toD(m + "-01"); d.setUTCMonth(d.getUTCMonth() + n); return toS(d).slice(0, 7); };
const min = (a, b) => a < b ? a : b;
const today = () => BN.todayBiz();   // 営業日（6:00 区切り）の今日。全ページ共通
function weeksOf(month) {
  const ms = month + "-01", me = monthEnd(ms), out = [];
  for (let s = ms, n = 1; s <= me; n++) {
    const e = min(add(monday(s), 6), me);
    out.push({ kind: "week", key: `w:${s}`, start: s, end: e, n, month });
    s = add(e, 1);
  }
  return out;
}
const monthP = (m) => ({ kind: "month", key: `m:${m}`, start: m + "-01", end: monthEnd(m + "-01"), month: m });
const yearP = (y) => ({ kind: "year", key: `y:${y}`, start: `${y}-01-01`, end: `${y}-12-31`, year: y });
function periodByKey(key) {
  if (!/^(y:\d{4}|m:\d{4}-(0[1-9]|1[0-2])|w:\d{4}-(0[1-9]|1[0-2])-\d{2})$/.test(key || "")) return null;
  const k = key.slice(0, 1), v = key.slice(2);
  if (k === "y") return yearP(v);
  if (k === "m") return monthP(v);
  return weeksOf(ym(v)).find((w) => w.start === v) || null;
}
function label(p) {
  if (p.kind === "year") return `${p.year}年`;
  const [y, m] = p.month.split("-").map(Number);
  return p.kind === "month" ? `${y}年${m}月` : `${y}年${m}月 第${p.n}週`;
}
const inProgress = (p) => p.start <= today() && today() <= p.end;
const monthsIn = (p) => { const out = []; for (let m = ym(p.start); m <= ym(p.end); m = addMonths(m, 1)) out.push(m); return out; };

/* ======================= Asana の読み込み（読むのは BN.readAll。ここは項目の読み方だけ） ======================= */
const fieldsOf = BN.fieldsOf;
const txt = (f, k) => BN.txt(f[k]);
const num = (f, k) => BN.num(f[k]);
const dt = (f, k) => BN.dateOf(f[k]) || "";
const en = (f, k) => f[k]?.enum_value?.name || "";

function parseStaff(t) {
  const f = fieldsOf(t), real = txt(f, "本名"), line = txt(f, "LINE名");
  return { gid: t.gid, url: t.permalink_url || "", sid: txt(f, "スタッフID") || "A" + t.gid, real, line,
           name: real || line || "（名前未設定）", kind: en(f, "区分"), joined: dt(f, "入社日"), wage: num(f, "時給"),
           wageFrom: dt(f, "時給の適用開始日"), rate: num(f, "バック率（%）") };
}
function parseAtt(t) {
  const f = fieldsOf(t), date = dt(f, "稼働日");
  if (!date || en(f, "勤怠ステータス") === "対象外" || txt(f, "店舗")) return null;
  return { sid: txt(f, "スタッフID"), date, hours: num(f, "稼働時間（h）") || 0, wageAmt: num(f, "時給の額"),
           start: txt(f, "勤務開始"), end: txt(f, "勤務終了"), name: txt(f, "スタッフ名"), line: txt(f, "LINE名"), url: t.permalink_url || "" };
}
function parsePay(t) {
  const f = fieldsOf(t), month = txt(f, "対象月");
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) return null;   // 手で入った書式違い（「10月」など）は読まない
  return { sid: txt(f, "スタッフID"), month, name: txt(f, "スタッフ名"), kind: en(f, "区分"), days: num(f, "勤務日数") || 0,
           hours: num(f, "稼働時間（h）") || 0, sales: num(f, "売上（本人）") || 0, count: num(f, "顧客組数") || 0,
           wagePart: num(f, "時給の分") || 0, rate: num(f, "バック率（%）"), back: num(f, "バック") || 0,
           adj: num(f, "調整額") || 0, reason: txt(f, "調整の理由"), pay: num(f, "給与"), status: en(f, "給与ステータス") || "不明",
           url: t.permalink_url || "" };
}
function parseSlip(t) {
  const f = fieldsOf(t), date = dt(f, "営業日"), amount = num(f, "伝票金額");
  if (!date || amount == null || en(f, "伝票ステータス") === "対象外" || txt(f, "伝票ID").startsWith("RS-")) return null;
  return { date, amount, promoter: txt(f, "プロモーター"), sender: txt(f, "担当（LINE）") };
}
/* 読み込んで描画する。返り値: true ＝ 読めた／false ＝ 失敗（画面に出した）／undefined ＝ 後から始まった読み込みに替わった */
async function load(refresh) {
  const live = BN.gen("staff"), env = BN.env.get();   // 途中で環境を読み直さない（古い読み込みの結果は捨てる）
  state.ver = BN.version();
  setMsg(null);
  $("staff-sub").textContent = "読み込んでいます…";
  try {
    state.mcp = state.mcp || await use("mcp");
    if (!live()) return;
    if (!state.mcp) {
      if (state.data) render(); else $("staff-sub").textContent = "";
      setMsg("Asana につながっていません", "このページで勤怠・給与を読むには、claude.ai で Asana（0x0.co.jp のアカウント）を接続し、ページの許可を出してください。", () => load(true));
      return false;
    }
    const [st, at, pa, sl] = await Promise.all(["ledger", "attendance", "payroll", "slips"].map((k) =>
      BN.readAll(state.mcp, BN.IDS[k][env], { refresh, required: REQUIRED[k] })));
    if (!live()) return;
    const d = { env, staff: st.map(parseStaff), att: at.map(parseAtt).filter(Boolean), pay: pa.map(parsePay).filter(Boolean),
                slips: sl.map(parseSlip).filter(Boolean), at: Date.now() };
    // 伝票の持ち主（プロモーターフラグ → その名前、無ければ送った人）。名前は台帳の LINE名、無ければ本名で照合（worker の by_name と同じ順）
    const norm = (s) => (s || "").normalize("NFKC").replace(/\s/g, "").replace(/(様|さま|さん)/gu, "");
    const index = (attr) => { const m = new Map(); d.staff.forEach((s) => { const k = norm(s[attr]); if (k) m.set(k, m.has(k) ? null : s.sid); }); return m; };   // 2人以上に合う名前は null
    const byLine = index("line"), byReal = index("real");
    // LINE名が2人以上で重なるときは決めない（本名の照合に進まない。worker と同じ）
    const owner = (k) => byLine.has(k) ? byLine.get(k) : (byReal.get(k) || null);
    d.slips.forEach((s) => { const k = norm(s.promoter || s.sender); s.sid = owner(k); s.lost = !!k && !s.sid; });
    state.data = d;
    state.sel = state.sel || periodByKey(store.get("staff-sel") || "") || monthP(ym(today()));
    render();
    return true;
  } catch (e) {
    if (!live()) return;
    console.warn("スタッフ管理: 読み込みに失敗", e?.code || e?.message || e);
    if (state.data) render(); else $("staff-sub").textContent = "";   // 前に読めた内容（同じ環境）があれば、時刻つきで残す
    setMsg("勤怠・給与を読み込めませんでした",
      BN.errText(e, "Asana") + "（勤怠・台帳・給与の Asana プロジェクトは、管理者だけが見られる非公開プロジェクトです。メンバーでない場合は読めません。）",
      () => load(true));
    return false;
  }
}

/* ======================= 集計 ======================= */
function people() {
  const d = state.data, map = new Map();
  d.staff.forEach((s) => map.set(s.sid, { ...s }));
  [...d.att, ...d.pay].forEach((r) => {
    if (r.sid && !map.has(r.sid)) map.set(r.sid, { sid: r.sid, name: r.name || r.line || "（台帳に無い人）", real: "", line: r.line || "", kind: r.kind || "", gid: null });
  });
  return [...map.values()].filter((p) => p.kind !== "管理者");
}
/* その人のその期間。月の給与の記録がある月は記録の値（調整額を含む）、無い月・週は勤怠と伝票から計算する */
function figures(p, period) {
  const d = state.data;
  const att = d.att.filter((r) => r.sid === p.sid && r.date >= period.start && r.date <= period.end).sort((a, b) => a.date.localeCompare(b.date));
  const slips = d.slips.filter((s) => s.sid === p.sid && s.date >= period.start && s.date <= period.end);
  const calc = (a, s) => {
    const sales = sum(s, (x) => x.amount), wagePart = p.kind === "プロモーター" ? 0 : sum(a, (r) => r.wageAmt);
    const back = p.rate ? Math.floor(sales * p.rate / 100) : 0;
    return { days: a.length, hours: sum(a, (r) => r.hours), sales, count: s.length, wagePart, back, adj: 0, cost: wagePart + back };
  };
  let out;
  if (period.kind === "week") out = { ...calc(att, slips), status: "勤怠と伝票から計算" };
  else {
    out = { days: 0, hours: 0, sales: 0, count: 0, wagePart: 0, back: 0, adj: 0, cost: 0 }; const st = new Set();
    monthsIn(period).forEach((m) => {
      const doc = d.pay.find((r) => r.sid === p.sid && r.month === m);
      // 「給与」が空の記録は、時給の分だけを数えて印を付ける（contract.md §2-5。¥0 と見せない）
      if (doc && doc.pay == null) out.noPay = true;
      const x = doc ? { ...doc, cost: doc.pay ?? doc.wagePart } : calc(att.filter((r) => ym(r.date) === m), slips.filter((s) => ym(s.date) === m));
      if (!doc && !x.days && !x.sales) return;
      st.add(doc ? doc.status : "勤怠と伝票から計算");
      for (const k of ["days", "hours", "sales", "count", "wagePart", "back", "adj", "cost"]) out[k] += x[k] || 0;
      if (doc && period.kind === "month") Object.assign(out, { doc, reason: doc.reason, url: doc.url });
    });
    out.status = [...st].join("・") || "記録なし";
  }
  // 給与の記録がある月は、そのときのバック率（台帳の今の率ではない）。時給の額が空の勤務は ¥0 に見えるので印を付ける
  return { ...out, att, slips, rate: out.doc ? out.doc.rate : p.rate, noWage: p.kind !== "プロモーター" && att.some((r) => r.wageAmt == null) };
}
const active = (x) => x.days || x.sales || x.cost;
function dataStart() {
  const d = state.data; let first = today();
  [...d.att.map((r) => r.date), ...d.pay.map((r) => r.month + "-01"), ...d.slips.filter((s) => s.sid).map((s) => s.date)].forEach((s) => { if (s < first) first = s; });
  return first;

  if (!canEdit) Object.values(f).forEach((e) => e.setAttribute("disabled", ""));

  const msg = h("span", { class: "msg", text: state.flash && state.flash.sid === p.sid ? state.flash.text : "" });
  state.flash = null;
  const ask = { sig: "" };   // 確かめの文を出した変更の内容。同じ内容でもう一度押されたら送る
  const save = h("button", { type: "button", class: "btn filled", text: "保存（Asana の台帳）", disabled: !canEdit, onclick: () => saveConditions(p, f, save, msg, ask) });
  return card("勤務条件", null,
    h("div", { class: "form" },
      h("label", {}, "本名", f.real), h("label", {}, "LINE名", f.line), h("label", {}, "区分", f.kind), h("label", {}, "入社日", f.joined),
      h("label", {}, "時給（円）", f.wage),
      h("label", {}, "時給の適用開始日", f.wageFrom),
      h("label", {}, "バック率（%）", f.rate)),
    h("div", { class: "actions" }, save,
      p.url ? h("a", { class: "btn plain", href: p.url, target: "_blank", rel: "noopener", text: "Asana で編集" }) : null, msg,
      !p.gid ? h("span", { class: "msg", text: "台帳にまだありません。" }) : null,
      state.canWrite === false ? h("span", { class: "msg", text: "このページから書き込む許可がありません。Asana で編集してください。" }) : null));
}
const COND_LABEL = { real: "本名", line: "LINE名", kind: "区分", joined: "入社日", wage: "時給", wageFrom: "時給の適用開始日", rate: "バック率" };
async function saveConditions(p, f, btn, msg, ask) {
  if (state.busy || !state.data) return;
  const v = (e) => e.value.trim(), cf = {}, t = today();
  // 入力の検査（外れた値は Asana に送らない）
  const okDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && toS(toD(s)) === s;
  const wrong = (k, ok) => f[k].validity?.badInput || (v(f[k]) !== "" && !ok(v(f[k])));
  const bad = [
    wrong("wage", (s) => /^\d+$/.test(s)) ? "時給（0 以上の整数）" : null,
    wrong("rate", (s) => Number(s) >= 0 && Number(s) <= 100) ? "バック率（0〜100）" : null,
    wrong("joined", okDate) ? "入社日（YYYY-MM-DD）" : null,
    wrong("wageFrom", okDate) ? "時給の適用開始日（YYYY-MM-DD）" : null].filter(Boolean);
  if (bad.length) { msg.textContent = "入力を確かめてください：" + bad.join("、"); return; }
  // 空にする変更は送れない（「変更はありません」と出さずに、できないと伝える）
  const was = { real: p.real || "", line: p.line || "", kind: p.kind || "", joined: p.joined || "", wage: p.wage ?? "", wageFrom: p.wageFrom || "", rate: p.rate ?? "" };
  const blank = Object.keys(COND_LABEL).filter((k) => v(f[k]) === "" && was[k] !== "");
  if (blank.length) { msg.textContent = "空にする変更は、ここではできません（Asana で直してください）：" + blank.map((k) => COND_LABEL[k]).join("、"); return; }
  if (v(f.real) !== was.real) cf[F.real] = v(f.real);
  if (v(f.line) !== was.line) cf[F.line] = v(f.line);
  if (v(f.kind) !== was.kind) cf[F.kind] = KIND_OPT[v(f.kind)];
  if (v(f.joined) !== was.joined) cf[F.joined] = { date: v(f.joined) };
  const wageNew = v(f.wage) !== "" && Number(v(f.wage)) !== p.wage;
  if (wageNew) cf[F.wage] = Number(v(f.wage));
  if (v(f.wageFrom) !== was.wageFrom) cf[F.wageFrom] = { date: v(f.wageFrom) };
  if (v(f.rate) !== "" && Number(v(f.rate)) !== p.rate) cf[F.rate] = Number(v(f.rate));
  if (!Object.keys(cf).length) { msg.textContent = "変更はありません。"; return; }
  // 時給だけを変えて適用開始日が前のままだと、worker がその日からの履歴を新しい額で上書きし、過去の勤務と給与を計算し直す（labor_hooks の _apply_wage）
  // 初めて時給を入れるとき（前の時給が無い）は、適用開始日が空でもよい（worker は過去の勤務すべてに当てる）
  if (wageNew && p.wage != null && v(f.wageFrom) !== t && (!v(f.wageFrom) || v(f.wageFrom) === was.wageFrom)) {
    f.wageFrom.value = t;
    msg.textContent = "時給を変えるときは、新しい時給の適用開始日が要ります。今日からにしました。日付を確かめて、もう一度「保存」を押してください。";
    return;
  }
  // 影響の大きい変更は、1回知らせてから送る（同じ内容でもう一度押したら送る）
  const warn = [];
  if (cf[F.wageFrom] && v(f.wageFrom) < t && v(f.wage) !== "") warn.push("時給の適用開始日が過去の日です。この日以降の勤務の時給の額と給与が計算し直されます。");
  if (cf[F.kind] && v(f.kind) === "管理者") warn.push("管理者にすると、この画面の一覧と集計に出なくなります（戻すのは Asana で）。");
  const sig = JSON.stringify(cf);
  if (warn.length && ask.sig !== sig) { ask.sig = sig; msg.textContent = warn.join("") + "よければもう一度「保存」を押してください。"; return; }

  const env = state.data.env, task = { task: p.gid, custom_fields: cf }, name = v(f.real) || v(f.line);
  if (name && name !== p.name) task.name = name;
  // 保存中は、この保存に関わる入力・ボタンと「更新」・環境の切り替えを止める
  const lock = (on) => { state.busy = on; [btn, $("staff-reload"), $("staff-env"), ...Object.values(f)].forEach((e) => { e.disabled = on; }); };
  lock(true); msg.textContent = "保存しています…";
  let text, wrote = false, ok;
  try {
    try {
      wrote = await BN.writeTasks(state.mcp, [task], env) === "ok";
      text = wrote ? "保存しました。勤怠・給与には30分以内に反映されます。" : "保存の結果を確認できませんでした。読み直した内容を確認してください";
    } catch (e) {
      console.warn("スタッフ管理: 保存に失敗", e?.code || e?.message || e);
      if (BN.writeDenied(e)) {
        state.canWrite = false; text = "このページから書き込む許可がありません。「Asana で編集」から直してください。";
      } else text = BN.errText(e, "Asana", "save");
    }
    ok = await load(true);   // どの場合も読み直して、実際の状態を表示する
  } finally { lock(false); }
  if (ok === undefined) { if (state.data) render(); else if (state.ver !== BN.version()) load(true); return; }   // 後から始まった読み込みに替わった。入力が無効のまま残らないよう描き直す
  // 保存の成否と、読み直しの成否は別に伝える
  state.flash = { sid: p.sid, text: ok ? text : wrote ? "保存しました。読み直しに失敗しました" : text + "（読み直しにも失敗しました）" };
  render();
}

/* ---------- AI の示唆（その人の数字だけを渡す。名前は渡さない） ---------- */
const insightKey = (env, p, per) => `${env}_${p.sid}_${per.key.replace(":", "_")}`;
/* 別の人・期間・環境へ移ったら、実行中の示唆を止める */
function stopAi() { if (state.aiRun) { state.aiRun.abort(); state.aiRun = null; } }
function insightInput(p, per, x) {
  const hist = [];
  let m = per.kind === "year" ? ym(min(per.end, today())) : ym(per.start);
  for (let i = 0; i < 6; i++) {
    const y = figures(p, monthP(m));
    if (active(y)) hist.push({ 月: m, 売上: y.sales, 給与: y.cost, 勤務日数: y.days, 顧客組数: y.count });
    m = addMonths(m, -1);
  }
  const team = teamTotal(per);
  // 時給とバック率は AI に渡さない（contract.md §1）。割り算で出せる数字（時給の分・バックの内訳、勤務時間）も渡さず、給与は合計だけにする。
  // 店全体の給与は、3人以上のときだけ渡す（2人だと引き算でもう1人の給与になる）
  return { 区分: p.kind || "未設定", 期間: label(per), 期間は進行中: inProgress(per),
           この期間: { 売上: x.sales, 給与: x.cost, 勤務日数: x.days, 顧客組数: x.count },
           月ごと: hist, 店全体の同じ期間: { sales: team.sales, cost: team.n >= 3 ? team.cost : null, n: team.n } };
}
function aiPrompt(input) {
  return `あなたはバー「Bar null」の経営を手伝う分析担当です。あるスタッフ（名前は伏せる）の数字から、示唆をまとめてください。
- 売上とコスト（給与）の関係（売上 ÷ 給与、コスト率）、前月までとの比較、店全体の中での位置づけを見る
- 数字に基づいて書き、推測には「可能性」と書く。人柄の評価や断定はしない。期間が進行中なら、その点を考慮する
- 日本語で簡潔に（各項目60字程度まで）
JSON だけを返す: {"headline": "ひとことの結論", "good": ["良い点"], "watch": ["注意点"], "actions": ["次の打ち手"]}（配列はそれぞれ1〜3個）

データ:
${JSON.stringify(input)}`;
}
function aiCard(p, x) {
  const per = state.sel, env = state.data.env, key = insightKey(env, p, per), cached = state.insights[key];   // env は、この表示のデータを読んだ環境
  const out = h("div", { class: "ai-out" }), msg = h("span", { class: "msg" });
  const btn = h("button", { type: "button", class: "btn tinted", text: cached ? "最新の数字で作り直す" : "示唆を作成", disabled: !state.sample || !!state.aiRun });
  const show = (doc) => {
    out.textContent = "";
    const r = doc.result || {};
    out.append(h("div", { class: "lead", text: r.headline || "" }));
    for (const [t, k] of [["良い点", "good"], ["注意点", "watch"], ["次の打ち手", "actions"]]) {
      if (Array.isArray(r[k]) && r[k].length) out.append(h("div", {}, h("h3", { text: t }), h("ul", {}, ...r[k].map((s) => h("li", { text: String(s) })))));
    }
    out.append(h("p", { class: "cap", style: "margin:0", text: `${new Date(doc.generated_at).toLocaleString("ja-JP")} に作成` }));
  };
  if (cached) show(cached);
  else if (state.db) state.db.doc(`staff_insights/${key}`).get().then((snap) => {
    const d = snap && (typeof snap.data === "function" ? snap.data() : snap);
    if (d && d.result && !state.insights[key]) { state.insights[key] = d; show(d); btn.textContent = "最新の数字で作り直す"; }
  }).catch(() => { if (!msg.textContent) msg.textContent = "保存済みの示唆を読めませんでした。"; });
  if (state.sample === null) msg.textContent = "このページから Claude を使う許可がありません。";
  btn.addEventListener("click", async () => {
    if (!state.sample || state.aiRun) return;
    const ctl = new AbortController(); state.aiRun = ctl; btn.disabled = true; msg.textContent = "作成しています…";
    try {
      const result = await state.sample.json(aiPrompt(insightInput(p, per, x)), { signal: ctl.signal, modelTier: "default", cache: false });
      if (ctl.signal.aborted) return;   // 別の人・期間・環境へ移った（結果は使わない）
      if (!result || typeof result !== "object" || !result.headline) throw { code: "invalid_json" };
      const doc = { env, sid: p.sid, period: per.key, result, generated_at: new Date().toISOString() };
      state.insights[key] = doc; show(doc); msg.textContent = ""; btn.textContent = "最新の数字で作り直す";
      if (state.db) Promise.resolve().then(() => state.db.doc(`staff_insights/${key}`).set(doc))
        .catch(() => { msg.textContent = "示唆は作りましたが、保存できませんでした（開き直すと消えます）。"; });
    } catch (e) {
      if (ctl.signal.aborted) return;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(e?.code)) { state.sample = null; msg.textContent = "このページから Claude を使う許可がありません。"; }
      else msg.textContent = e?.code === "rate_limited" ? "混み合っています。時間をおいてお試しください。" : "示唆を作れませんでした（" + (e?.code || "エラー") + "）。";
    } finally {
      if (state.aiRun === ctl) state.aiRun = null;
      if (btn.isConnected) btn.disabled = !state.sample;
      // 実行中に同じ表示が描き直されていたら、新しいボタンが無効のまま残らないように描き直す
      else if (!ctl.signal.aborted && !state.aiRun && !state.busy && state.data && state.sid === p.sid) render();
    }
  });
  return card("AI の示唆", null,
    h("div", { class: "actions", style: "margin-top:0" }, btn, msg), out,
    h("details", { class: "defs" }, h("summary", { text: "Claude に渡す数字" }),
      h("p", { text: "この人の売上・給与・勤務日数・顧客組数（前月まで）と、店全体の合計だけ。名前・時給・バック率は渡さない。" })));
}

/* ======================= 起動 ======================= */
$("staff-env").value = BN.env.get();
$("staff-env").addEventListener("change", (e) => BN.env.set(e.target.value));   // 読み直しは下の portal:env で行う
/* 環境が変わったら（ほかのページでの切り替えも）、前の環境の表や保存ボタンを残さないよう、先に消してから読み直す */
window.addEventListener("portal:env", () => {
  $("staff-env").value = BN.env.get();
  stopAi(); state.sid = null; state.data = null; state.flash = null;
  $("staff-title").textContent = "スタッフ管理";
  render();
  // 非表示の間は読まない（全ページが一斉に読むのを避ける）。戻ったとき（portal:route）に読む
  const box = $("staff-env").closest(".page");
  if (box && box.hidden) { BN.gen("staff"); state.ver = -1; } else load();
});
/* このページに戻ったとき、ほかのページの書き込みがあれば読み直す */
window.addEventListener("portal:route", (e) => {
  if (e.detail && e.detail.key === "cost-staff" && !state.busy && state.ver !== BN.version()) load(true);
});
$("staff-tab-overview").addEventListener("click", () => { stopAi(); state.tab = "overview"; state.sid = null; render(); });
$("staff-tab-payroll").addEventListener("click", () => { stopAi(); state.tab = "payroll"; state.sid = null; render(); });
$("staff-reload").addEventListener("click", () => { if (!state.busy) load(true); });
$("staff-navtoggle").addEventListener("click", () => {
  const open = $("staff-side").classList.toggle("open"); $("staff-navtoggle").setAttribute("aria-expanded", String(open));
});
use("sample").catch(() => null).then((s) => { state.sample = s; if (state.sid && state.data && !state.busy) render(); });
use("db").catch(() => null).then((db) => { state.db = db; });
load();
</script>
