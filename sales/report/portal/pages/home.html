<!-- ホーム（ダッシュボード）。index.html の殻が fetch して差し込む。ids は hm- の接頭辞。
     AWS Console Home のように、ウィジェット（見出し・本文・下端のリンク）を並べる。数字と項目は緑字のリンクで、それぞれの画面へ飛べる。
     グラフに触れると詳細のポップアップが出て、その中の数値も各画面へのリンクになる。
     数字は BN.ledger（コスト管理と同じ集計。contract.md §1b・§4・§5）。費用は持ち主・Editor だけに出す（<html data-cost="1">）。 -->
<style>
.pg-home{position:relative;display:flex;flex-direction:column;gap:20px;max-width:1400px;padding-bottom:40px}
.pg-home .hm-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;padding:4px 0 0}
.pg-home h1{margin:0;font-size:28px;line-height:36px;font-weight:400}
.pg-home .hm-desc{margin:2px 0 0;color:var(--label-2);font-size:14px}
/* 月の切り替え */
.pg-home .mstep{display:inline-flex;align-items:center;border:1px solid var(--border-input);border-radius:var(--r-control);background:var(--card-solid)}
.pg-home .mstep button{width:32px;height:30px;border:0;background:none;color:var(--label-2);cursor:pointer;font-size:16px}
.pg-home .mstep button:hover{color:var(--accent-text);background:var(--fill)}
.pg-home .mstep button[disabled]{opacity:.35;cursor:default;background:none}
.pg-home .mstep b{min-width:7.5em;text-align:center;font-size:14px;border-inline:1px solid var(--separator);line-height:30px}
/* ウィジェット（AWS の board item: 見出し・本文・下端のリンク） */
.pg-home .board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.pg-home .wd{display:flex;flex-direction:column;min-width:0;border-radius:var(--r-card)}
.pg-home .wd.full{grid-column:1 / -1}
.pg-home .wd-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 16px;padding:16px 20px 4px}
.pg-home .wd-h h2{margin:0;font-size:18px;line-height:22px;font-weight:700}
.pg-home .wd-cap{margin:4px 0 0;font-size:12px;line-height:16px;color:var(--label-2)}
.pg-home .wd-act{flex:none;font-size:14px;color:var(--accent-text);text-decoration:none;white-space:nowrap;padding-top:2px}
.pg-home .wd-act:hover,.pg-home .wd-f a:hover,.pg-home a.kv-link:hover,.pg-home .health a:hover,.pg-home .dn-list a:hover{text-decoration:underline}
.pg-home .wd-b{flex:1;padding:12px 20px 20px;min-width:0}

.pg-home .wd-f a{font-size:14px;color:var(--accent-text);text-decoration:none}
/* 概要（AWS の Cost and usage: 左に大きな数字、右にグラフ） */
.pg-home .ov{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px 32px}

.pg-home .chart .pl{font-weight:700}

/* 横スクロール（12か月）。縦の目盛りは左に固定する */
.pg-home .hs{display:flex;min-width:0}
.pg-home .hs .yax{flex:none;display:block}
.pg-home .hscroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px}
.pg-home .chart .hs svg{display:block;width:auto;max-width:none;height:auto}   /* 共通の .chart svg{width:100%} を打ち消し、描いた幅のまま出す */
.pg-home .legend{margin-top:10px}

.pg-home .note{margin:8px 0 0;font-size:12px;line-height:16px;color:var(--label-2)}
/* ポップアップ（グラフに触れると出る。中の数値は各画面へのリンク） */
.pg-home .hm-pop{position:absolute;z-index:20;width:max-content;min-width:220px;max-width:min(320px,calc(100% - 8px));padding:10px 14px 12px;
  background:var(--card-solid);border:1px solid var(--border);box-shadow:var(--shadow-pop);font-size:13px;line-height:18px}
.pg-home .hm-pop h3{margin:0 18px 6px 0;font-size:14px;line-height:18px;font-weight:700}
.pg-home .hm-pop dl{display:grid;grid-template-columns:minmax(0,auto) auto;gap:3px 18px;margin:0}
.pg-home .hm-pop dt{color:var(--label-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pg-home .hm-pop dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.pg-home .hm-pop .pos{color:var(--green)} .pg-home .hm-pop .neg{color:var(--red)} .pg-home .hm-pop .na{color:var(--label-3)}
.pg-home .hm-pop .sw{display:inline-block;width:9px;height:9px;flex:none}
.pg-home .hm-pop .hint{margin:8px 0 0;font-size:12px;line-height:16px;color:var(--label-3)}
.pg-home .hm-pop-x{position:absolute;top:4px;right:6px;width:24px;height:24px;border:0;background:none;color:var(--label-2);cursor:pointer;font-size:16px;line-height:1}
.pg-home .hm-pop-x:hover{color:var(--label)}
/* 構成比（円グラフ） */
.pg-home .dn{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px 24px;align-items:center}
.pg-home .dn svg{display:block;width:200px;height:200px}
.pg-home .dn .seg{cursor:pointer;outline:none}
.pg-home .dn .seg:hover,.pg-home .dn .seg:focus-visible{stroke-width:34}
.pg-home .dn .c1{font-size:12px;fill:var(--label-2)} .pg-home .dn .c2{font-size:18px;font-weight:700;fill:var(--label)}
.pg-home .dn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pg-home .dn-list li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3.6em;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--separator);font-size:14px}
.pg-home .dn-list li:last-child{border-bottom:0}
.pg-home .dn-list i{width:10px;height:10px}
.pg-home .dn-list a{color:var(--accent-text);text-decoration:none}
.pg-home .dn-list .v{text-align:right;font-variant-numeric:tabular-nums}
.pg-home .dn-list .p{text-align:right;color:var(--label-2);font-variant-numeric:tabular-nums}
/* 損益分岐 */
.pg-home .be-big{font-size:26px;line-height:32px;font-weight:400;margin:0 0 4px}
.pg-home .be-big.pos{color:var(--green)}
.pg-home .be-sub{font-size:14px;color:var(--label-2)}
.pg-home .be-track{position:relative;height:24px;margin:40px 0 8px;background:var(--fill-2)}
.pg-home .be-fill{position:absolute;inset:0 auto 0 0;background:var(--c-rev2)}
.pg-home .be-pace{position:absolute;top:0;bottom:0;border:2px dashed var(--c-rev2);border-left:0}

.pg-home .be-mark span{position:absolute;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:var(--label);margin-bottom:2px}
.pg-home .be-mark.edge-r span{transform:translateX(-100%)} .pg-home .be-mark.edge-l span{transform:none}
.pg-home .be-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--label-2)}
.pg-home .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin-top:16px}
.pg-home .kv div{display:flex;flex-direction:column}
.pg-home .kv span{font-size:12px;font-weight:700;color:var(--label-2)}
.pg-home .kv b{font-size:16px;font-weight:400}
/* データの状態（AWS の StatusIndicator） */
.pg-home .health{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));column-gap:32px}
.pg-home .health li{display:grid;grid-template-columns:minmax(8em,auto) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--separator);font-size:14px}
.pg-home .health a,.pg-home .health .nm{color:var(--accent-text);text-decoration:none}
.pg-home .health .nm.plain{color:var(--label);font-weight:700}
.pg-home .st{display:inline-flex;align-items:flex-start;gap:6px}
.pg-home .st i{flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--font);font-style:normal;color:var(--card-solid)}
.pg-home .st.ok{color:var(--green)} .pg-home .st.ok i{background:var(--green)}
.pg-home .st.warn{color:var(--warn-text)} .pg-home .st.warn i{background:var(--warn)}
.pg-home .st.err{color:var(--red)} .pg-home .st.err i{background:var(--red)}
.pg-home .st.wait{color:var(--label-2)} .pg-home .st.wait i{background:var(--label-3)}
.pg-home .st small{display:block;color:var(--label-2);font-size:12px;line-height:16px}
.pg-home .empty{padding:24px 0;text-align:center}
@media (max-width: 1100px){ .pg-home .ov{grid-template-columns:minmax(0,1fr)} .pg-home .kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }
@media (max-width: 1279px){ .pg-home .board{grid-template-columns:minmax(0,1fr)} }   /* 2列にすると、グラフの文字が小さくなりすぎる */
@media (max-width: 900px){ .pg-home h1{font-size:24px;line-height:30px} }
@media (max-width: 520px){ .pg-home .dn{grid-template-columns:minmax(0,1fr);justify-items:center} .pg-home .dn-list{width:100%} }
</style>

<div class="pg-home" id="hm-root">
  <header class="hm-head">
    <div><h1>ダッシュボード</h1><p class="hm-desc" id="hm-sub">読み込んでいます</p></div>
    <span class="mstep" role="group" aria-label="対象の月"><button type="button" id="hm-prev" aria-label="前の月">‹</button><b id="hm-month" class="num">—</b><button type="button" id="hm-next" aria-label="次の月">›</button></span>
  </header>
  <div id="hm-notice"></div>
  <div class="board" id="hm-board"></div>
  <p class="foot" id="hm-foot"></p>
</div>

<script type="module">
const BN = window.BN;   // 共通部品（common.js）。殻がこのページより先に実行している
const { todayBiz } = BN;
const $ = (id) => document.getElementById(id);
const use = (n) => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const link = (href, text, cls) => { const a = el("a", cls, text); a.href = href; return a; };
const yen = (v) => v == null ? "—" : (v < 0 ? "−" : "") + "¥" + Math.abs(Math.round(v)).toLocaleString("ja-JP");
const man = (v) => { const a = Math.abs(v), s = v < 0 ? "−" : ""; return a >= 10000 ? `${s}${(a / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 1 })}万` : `${s}${Math.round(a).toLocaleString("ja-JP")}`; };
const pc = (x) => x == null || !isFinite(x) ? "—" : `${(x * 100).toFixed(1)}%`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const addM = (m, n) => { const d = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const mLabel = (m) => `${+m.slice(0, 4)}年${+m.slice(5, 7)}月`;
const mShort = (m) => `${+m.slice(5, 7)}月`;
const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const daysIn = BN.ledger.daysIn;
const S = BN.ledger.STATE;
/* 費目の状態の言葉。固定費の項目が無い月は §3c どおり「未設定」、レンタルの確定値が無い月は「未確定」 */
const stName = (key, s) => key === "fixed" && s === "none" ? "未設定" : key === "rent" && s === "none" ? "未確定" : (S[s] || s || "—");

/* 費目（色は shared.css。コスト管理と同じ）。route はその費目の画面 */
const CATS = [
  { key: "purchase", name: "仕入", color: "var(--c-purchase)", route: "#cost-purchase" },
  { key: "labor", name: "人件費", color: "var(--c-labor)", route: "#cost-staff" },
  { key: "supplies", name: "備品・消耗品", color: "var(--c-supplies)", route: "#cost-supplies" },
  { key: "fee", name: "決済手数料", color: "var(--c-fee)", route: "#cost-var" },
  { key: "fixed", name: "固定費", color: "var(--c-fixed)", route: "#cost-fixed" },
];
const REV = "var(--c-rev2)", RENT = "var(--series-rent)";

/* pin ＝ 押して留めたポップアップ（{chart, key}）。描き直したあとも同じものを出し直す */
const st = { env: BN.env.get(), version: -1, month: todayBiz().slice(0, 7), mcp: undefined, L: BN.ledger.create(BN.env.get()), cost: false, loadedCost: null, pin: null };
const canCost = () => document.documentElement.dataset.cost === "1";

/* ---------- 読み込み ---------- */
async function load() {
  const live = BN.gen("home"), env = BN.env.get();
  st.env = env; st.version = BN.version(); st.cost = canCost(); st.loadedCost = st.cost;
  st.L = BN.ledger.create(env); render();
  if (!st.mcp) { st.mcp = await use("mcp").catch(() => null); if (!live()) return; }
  if (!st.mcp) { st.version = -1; render(); return; }
  const L = st.L;
  await BN.ledger.load(st.mcp, L, { cost: st.cost, live: () => live() && st.L === L, step: () => { if (live() && st.L === L) render(); } });
}

/* ---------- 部品 ---------- */
/* ウィジェット: 見出し（右に開く先のリンク）・本文・下端のリンク */
function widget(o) {
  const w = el("section", "wd lg" + (o.full ? " full" : "")), h = el("header", "wd-h"), t = el("div");
  t.append(el("h2", "", o.title)); if (o.cap) t.append(el("p", "wd-cap", o.cap));
  h.append(t); if (o.action) h.append(link(o.action[1], o.action[0], "wd-act"));
  const b = el("div", "wd-b" + (o.chart ? " chart" : "")); (o.body || []).forEach((n) => n && b.append(n));
  w.append(h, b);
  if (o.foot && o.foot.length) { const f = el("footer", "wd-f"); o.foot.forEach(([x, href]) => f.append(link(href, x))); w.append(f); }
  return w;
}
/* 大きな数字（AWS の key-value）。href があれば緑字のリンク */
function kv(label, value, sub, href, cls) {
  const d = el("div"); d.append(el("div", "kv-k", label));
  const v = href && value !== "—" ? link(href, value, "kv-v num kv-link" + (cls ? " " + cls : "")) : el("span", "kv-v num" + (cls ? " " + cls : ""), value);
  d.append(v); if (sub) { const s = el("div", "kv-d"); if (typeof sub === "string") s.textContent = sub; else s.append(...sub); d.append(s); }
  return d;
}
/* 増減の印（↑ 緑・↓ 赤）と文 */
function delta(now, prev, text) {
  if (now == null || !prev) return null;
  const r = now / prev - 1, up = r >= 0, s = el("span", up ? "up" : "down", `${up ? "↑" : "↓"} ${Math.abs(r * 100).toFixed(0)}%`);
  return [s, ` ${text}`];
}
function noticeBox(title, body, kind) { const d = el("div", "notice" + (kind ? " " + kind : "")); d.append(el("strong", "", title), body); return d; }
const emptyMsg = (L) => L.error ? "伝票を読み込めませんでした。" : st.mcp === null ? "Asana につながっていません。" : "読み込み中です。";

/* 今月は、まだ終わっていない今日を数えない（伝票は営業日の途中で入るため）。done ＝ 済んだ営業日の数 */
function doneDays(m, today) { return m === today.slice(0, 7) ? +today.slice(8, 10) - 1 : daysIn(m); }
function salesUpTo(m, day) {
  const d = st.L.daily; if (!d) return null;
  let s = 0; for (let i = 1; i <= Math.min(day, daysIn(m)); i++) { const x = d[`${m}-${String(i).padStart(2, "0")}`]; if (x) s += x.sales; }
  return s;
}

/* ---------- ポップアップ ----------
   マウス: 載せると出て、離すと消える（ポップアップの上に移れば残る）。押す・指で触れると、その場に留まる（× か外側で閉じる）。
   キーボード: フォーカスで出る。Enter で留める。中の数値は各画面へのリンク。 */
const pop = { el: null, timer: 0, pinned: false, anchor: null };
function popEl() {
  if (pop.el && pop.el.isConnected) return pop.el;
  const p = el("div", "hm-pop"); p.hidden = true; p.setAttribute("role", "dialog");
  p.addEventListener("pointerenter", () => clearTimeout(pop.timer));
  p.addEventListener("pointerleave", () => { if (!pop.pinned) hideLater(); });
  p.addEventListener("focusin", () => clearTimeout(pop.timer));
  p.addEventListener("focusout", (e) => { if (!pop.pinned && !p.contains(e.relatedTarget)) hideLater(); });
  $("hm-root").append(p); pop.el = p; return p;
}
function showPop(anchor, content, pinned) {
  clearTimeout(pop.timer);
  const p = popEl(), keep = st.focusPop || p.contains(document.activeElement);   // キーボードで留めた・中にフォーカスがあった
  p.textContent = "";
  if (pinned) { const x = el("button", "hm-pop-x", "×"); x.type = "button"; x.setAttribute("aria-label", "閉じる"); x.addEventListener("click", () => hidePop(true)); p.append(x); }
  p.append(...content); p.hidden = false; pop.pinned = !!pinned; pop.anchor = anchor;
  if (pinned && keep) { st.focusPop = false; const x = p.querySelector(".hm-pop-x"); if (x) x.focus({ preventScroll: true }); }   // 中のリンクへ Tab で進めるよう × にフォーカス
  p.setAttribute("aria-label", (content[0] && content[0].textContent) || "詳細");
  const root = $("hm-root").getBoundingClientRect(), r = anchor.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  const left = Math.max(0, Math.min(r.left - root.left + r.width / 2 - pw / 2, root.width - pw));
  const shell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--shell-h")) || 48;
  const above = r.top - ph - 8 > shell + 4;
  p.style.left = `${left}px`; p.style.top = `${above ? r.top - root.top - ph - 8 : r.bottom - root.top + 8}px`;
}
function hideLater() { clearTimeout(pop.timer); pop.timer = setTimeout(() => hidePop(false), 250); }
function hidePop(force) { if (pop.pinned && !force) return; clearTimeout(pop.timer); if (pop.el) pop.el.hidden = true; pop.pinned = false; pop.anchor = null; if (force) st.pin = null; }
document.addEventListener("pointerdown", (e) => {
  if (!pop.el || pop.el.hidden || !pop.pinned) return;
  if (pop.el.contains(e.target) || (pop.anchor && pop.anchor.contains(e.target))) return;
  hidePop(true);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pop.el && !pop.el.hidden) { const a = pop.anchor; hidePop(true); if (a && a.focus) a.focus(); } });
/* 中身: 見出しと、行 [名前, 値, リンク先, {color, cls, sep}] */
function popBody(title, rows, hint) {
  const out = [el("h3", "", title)], dl = el("dl");
  rows.forEach((r) => {
    if (r === "sep") { dl.append(el("div", "sep")); return; }
    const [label, value, href, o] = r, opt = o || {}, dt = el("dt"), dd = el("dd", opt.cls || "");
    if (opt.color) { const s = el("i", "sw"); s.style.background = opt.color; dt.append(s); }
    dt.append(label); if (opt.tot) { dt.classList.add("tot"); dd.classList.add("tot"); }
    dd.append(href && value !== "—" ? link(href, value) : value);
    dl.append(dt, dd);
  });
  out.push(dl); if (hint) out.push(el("p", "hint", hint));
  return out;
}
/* 前月の行。今月は途中までの値なので、前月の1か月分だけを出して差は出さない（同じ日までの比較は概要の数字で出している）。
   cost: 費用なら増えたら赤、売上なら増えたら緑 */
function prevRows(v, pv, pm, isCur, cost) {
  if (isCur) return [[`前月（${mShort(pm)}・1か月分）`, yen(pv)]];
  const dv = v - pv;
  return [[`前月（${mShort(pm)}）`, yen(pv)], ["前月との差", (dv > 0 ? "+" : dv < 0 ? "−" : "±") + yen(Math.abs(dv)), null, { cls: dv === 0 ? "" : (dv > 0) === !cost ? "pos" : "neg" }]];
}
/* グラフの要素に、ポップアップを付ける。onPick があれば、押したときにそれを呼ぶ（そのあと留める） */
function attachPop(node, chart, key, build, onPick) {
  node.setAttribute("tabindex", "0"); node.setAttribute("role", "button");
  // 指で触れたときは、スクロールのつもりで触れただけで開かないよう、pointerenter では何もしない（押した＝click で開いて留める）
  node.addEventListener("pointerenter", (e) => { if (pop.pinned || e.pointerType === "touch") return; showPop(node, build(), false); });
  node.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") hideLater(); });
  node.addEventListener("focus", () => { if (!pop.pinned) showPop(node, build(), false); });
  node.addEventListener("blur", () => { if (!pop.pinned) hideLater(); });
  const pick = () => { st.pin = { chart, key }; if (onPick) onPick(); else showPop(node, build(), true); };
  node.addEventListener("click", pick);
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); st.focusPop = true; pick(); } });
  if (st.pin && st.pin.chart === chart && st.pin.key === key) setTimeout(() => {
    if (!node.isConnected) return;
    const a = document.activeElement; if (!st.focusPop && (!a || a === document.body || !a.isConnected)) node.focus({ preventScroll: true });   // 描き直しで消えたフォーカスを戻す
    showPop(node, build(), true);
  });
}

/* ---------- 表示 ---------- */

  $("hm-next").disabled = st.month >= cur;
  $("hm-sub").textContent = `${st.env === "test" ? "テスト用のデータ・" : ""}Bar null の売上とコストの概要${st.cost ? "" : "（コストは管理者だけが見られます）"}`;
  const nb = $("hm-notice"); nb.textContent = "";

    : "売上合計＝通常営業の伝票金額（未収を含み、取消を除く）＋レンタルの店舗収益（月次確定値のある月だけ）。金額は税込";
}

/* 月のポップアップ（12か月のグラフ）。数値は各画面へのリンク */
function monthPop(M) {
  const rows = [["売上合計", yen(M.revenue), "#sales", { tot: true }], ["通常営業", yen(M.sales), "#sales", { color: REV }],
    ["レンタル", M.c.rent.s === "ok" ? yen(M.rent || 0) : stName("rent", M.c.rent.s), "#sales", { color: RENT, cls: M.c.rent.s === "ok" ? "" : "na" }]];
  if (st.cost) {
    rows.push("sep");
    CATS.forEach((c) => { const x = M.c[c.key]; rows.push([c.name, x.v == null ? stName(c.key, x.s) : yen(x.v), c.route, { color: c.color, cls: x.v == null ? "na" : "" }]); });
    rows.push(["コスト合計", yen(M.known), "#cost", { tot: true }], "sep");
    if (M.profit != null) rows.push(["利益", yen(M.profit), "#cost", { tot: true, cls: M.profit >= 0 ? "pos" : "neg" }]);
    else rows.push([M.ref != null ? "利益（参考）" : "利益", M.ref != null ? yen(M.ref) : "—", null, { tot: true, cls: "na" }]);
  } else rows.push(["伝票の数", M.slipCount == null ? "—" : `${M.slipCount}件`, "#sales"]);
  return popBody(mLabel(M.m), rows, M.m === st.month ? "ダッシュボードで表示中の月" : "押すと、この月をダッシュボードで表示します");
}

/* 1. 概要（左に大きな数字、右に12か月の推移） */
function overview(M, P, months, isCur, today) {
  const kvs = el("div", "kvs");
  // 売上合計: 今月は「前月の同じ日まで」と、過去の月は前月と比べる（通常営業）
  const done = doneDays(M.m, today);
  let cmp = null;
  if (M.sales != null) {
    if (isCur) { if (done >= 1 && done <= daysIn(P.m)) cmp = delta(salesUpTo(M.m, done), salesUpTo(P.m, done), `前月の同じ日（${done}日）まで・通常営業`); }
    else cmp = delta(M.sales, P.sales, "前月より・通常営業");
  }
  const rentTxt = M.c.rent.s === "ok" ? `レンタル ${yen(M.rent || 0)}` : "レンタルは月次確定前";
  kvs.append(kv(isCur ? "今月の売上合計" : "売上合計", yen(M.revenue), M.revenue == null ? emptyMsg(st.L) : [...(cmp ? [...cmp, el("br")] : []), `通常営業 ${yen(M.sales)}・${rentTxt}`], "#sales"));
  if (!st.cost) {
    const days = st.L.daily ? Object.keys(st.L.daily).filter((d) => d.startsWith(M.m)).length : null;
    const mini = el("div", "kv-mini");
    mini.append(kv("伝票の数", M.slipCount == null ? "—" : `${M.slipCount.toLocaleString("ja-JP")}件`, days != null ? `伝票のあった日 ${days}日` : "", "#sales"),
      kv("1日あたり", days ? yen(M.sales / days) : "—", "通常営業・伝票のあった日", "#sales"));
    kvs.append(mini);
  } else {
    const pcmp = !isCur && M.complete && P.complete ? delta(M.known, P.known, "前月より") : null;   // 記録の欠けた月どうしは比べない
    kvs.append(kv("コスト合計", yen(M.known), M.known == null ? emptyMsg(st.L) : [...(pcmp ? [...pcmp, el("br")] : []), `変動費 ${yen(M.varKnown)}・固定費 ${M.fixed == null ? stName("fixed", M.c.fixed.s) : yen(M.fixed)}${M.complete ? "" : "（記録済みの分）"}`], "#cost"));
    // 利益: 費用とレンタルがそろった月だけ断定する（§5）。そろわない月は灰色の参考値
    const pLabel = isCur ? "ここまでの損益" : "利益";
    if (M.profit != null) kvs.append(kv(pLabel, yen(M.profit), `利益率 ${pc(M.profit / M.revenue)}${M.est ? "・人件費は見込み" : ""}${isCur ? "・固定費は月額で引いています" : ""}`, "#cost", M.profit >= 0 ? "pos" : "neg"));
    else {
      const miss = [...CATS, { key: "rent", name: "レンタル" }].filter((c) => !["ok", "est"].includes(M.c[c.key].s)).map((c) => `${c.name}：${stName(c.key, M.c[c.key].s)}`);
      kvs.append(kv(M.ref == null ? pLabel : pLabel + "（参考）", M.ref == null ? "—" : yen(M.ref), miss.length ? `記録がそろっていません（${miss.slice(0, 2).join("・")}${miss.length > 2 ? "ほか" : ""}）` : emptyMsg(st.L), null, "na"));
    }
    // 率は記録がそろった費目だけ出す（売上管理と同じ。「一部のみ」は — にして、記録済みの額だけを添える）
    const pur = M.c.purchase, lab = M.c.labor, full = (s) => s === "ok" || s === "est", mini = el("div", "kv-mini");
    const part = (x, name) => x.v != null ? `${name}：${stName("", x.s)}（記録済み ${yen(x.v)}）` : `${name}：${stName("", x.s)}`;
    mini.append(kv("原価率", full(pur.s) && M.sales ? pc(pur.v / M.sales) : "—", full(pur.s) ? `仕入 ${yen(pur.v)} ÷ 通常営業の売上` : part(pur, "仕入"), "#cost-purchase"),
      kv("人件費率", full(lab.s) && M.revenue ? pc(lab.v / M.revenue) : "—", full(lab.s) ? `人件費 ${yen(lab.v)}${lab.s === "est" ? "（見込み）" : ""} ÷ 売上合計${M.c.rent.s === "ok" ? "" : "（レンタルは確定前）"}` : part(lab, "人件費"), "#cost-staff"));
    kvs.append(mini);
  }
  const ov = el("div", "ov"), right = el("div", "chart");
  right.append(el("div", "chart-y", st.cost ? "売上とコスト（円）" : "売上（円）"));

  return widget({ full: true, title: st.cost ? "売上とコスト" : "売上", cap: `${mLabel(M.m)}${isCur ? "（集計中）" : ""}・グラフは直近12か月。棒に触れると内訳、押すとその月を表示`,
    action: ["売上管理を開く", "#sales"], body: [ov],
    foot: st.cost ? [["売上管理を開く", "#sales"], ["コスト管理を開く", "#cost"], ["変動費の内訳を見る", "#cost-var"]] : [["売上管理を開く", "#sales"]] });
}

/* 12か月の推移。左の棒が売上合計（通常営業＋レンタル）、右の棒がコスト（費目の積み上げ）。下の数字が利益（灰色は参考値）。
   月ごとの幅を決めて描き、足りないときは横にスクロールする（縦の目盛りは左に固定）。最初は新しい月が見える位置 */
const SLOT = 84;   // 1か月の幅（px）。棒は売上・コストとも 28px
function trend(box, months) {
  const H = st.cost ? 290 : 250, AX = 50, T = 12, B = st.cost ? 44 : 26, ih = H - T - B;
  const costOf = (M) => CATS.reduce((x, c) => x + (M.c[c.key].v || 0), 0);
  const mx = Math.max(10000, ...months.map((M) => Math.max(M.revenue || 0, st.cost ? costOf(M) : 0)));   // 読み込み中でも目盛りが 0・1 にならないように
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(mx))); return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((k) => k * p >= mx) * p; })();
  const y = (v) => T + ih - v / nice * ih;
  // 左に固定する縦の目盛り
  let ax = ""; for (let i = 0; i <= 4; i++) { const v = nice * i / 4; ax += `<text x="${AX - 6}" y="${y(v) + 4}" text-anchor="end">${i ? man(v) : "0"}</text>`; }
  const hs = el("div", "hs"), sc = el("div", "hscroll");
  hs.innerHTML = `<svg class="yax" width="${AX}" height="${H}" viewBox="0 0 ${AX} ${H}" aria-hidden="true">${ax}</svg>`;
  hs.append(sc); box.append(hs);
  const draw = (slot) => {
    if (pop.anchor && sc.contains(pop.anchor) && !pop.pinned) hidePop(false);   // 描き直しで消える棒に付いたポップアップは閉じる
    const W = slot * months.length, bw = st.cost ? Math.min(30, slot * .34) : Math.min(44, slot * .5);
    let g = ""; for (let i = 0; i <= 4; i++) { const yy = y(nice * i / 4); g += `<line class="gl" x1="0" x2="${W}" y1="${yy}" y2="${yy}"/>`; }
    months.forEach((M, i) => {
      const cx = slot * i + slot / 2, on = M.m === st.month;
      let s = `<g class="hit mcol${on ? " on" : ""}" data-m="${M.m}" aria-label="${esc(mLabel(M.m))}の内訳"><rect class="bg" x="${slot * i + 2}" y="${T}" width="${slot - 4}" height="${ih}" fill="transparent"/>`;
      const rx = st.cost ? cx - bw - 1 : cx - bw / 2;
      if (M.revenue) {
        const sh = Math.max(0, M.sales || 0), rh = Math.max(0, M.rent || 0);
        s += `<rect class="bar" x="${rx}" y="${y(sh)}" width="${bw}" height="${ih + T - y(sh)}" fill="${REV}"/>`;
        if (rh) s += `<rect class="bar" x="${rx}" y="${y(sh + rh)}" width="${bw}" height="${Math.max(1, y(sh) - y(sh + rh) - 1)}" fill="${RENT}"/>`;
      }
      if (st.cost) {
        let base = 0;
        CATS.forEach((c) => { const v = M.c[c.key].v; if (!v || v <= 0) return; const y1 = y(base + v), h = Math.max(1, y(base) - y1 - 1); s += `<rect class="bar" x="${cx + 1}" y="${y1}" width="${bw}" height="${h}" fill="${c.color}"/>`; base += v; });
        const p = M.profit, r = M.ref;
        const txt = p != null ? (p >= 0 ? "+" : "") + man(p) : r != null ? (r >= 0 ? "+" : "") + man(r) : "—";
        s += `<text class="pl${p == null ? (r != null ? " ref" : "") : p >= 0 ? " pos" : " neg"}" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(txt)}</text>`;
      }
      s += `<text x="${cx}" y="${H - (st.cost ? 24 : 8)}" text-anchor="middle"${on ? ' class="lab"' : ""}>${mShort(M.m)}</text></g>`;
      g += s;
    });
    // 中に押せる月があるので role は group
    sc.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="月ごとの売上${st.cost ? "とコスト" : ""}">${g}</svg>`;
    sc.querySelectorAll("g.mcol").forEach((n) => {
      const M = months.find((x) => x.m === n.dataset.m);
      attachPop(n, "trend", M.m, () => monthPop(M), () => { st.month = M.m; render(); });
    });
  };
  draw(SLOT);
  // 幅に余裕があれば広げて描き直す。足りなければ横スクロール（新しい月が見えるよう右端へ）
  setTimeout(() => {
    if (!sc.isConnected) return;
    const w = sc.clientWidth; if (w > SLOT * months.length) draw(Math.floor(w / months.length));
    sc.scrollLeft = sc.scrollWidth;
  });
  const lg = el("div", "legend"), sw = (c, t) => { const s = el("span"), d = el("i", "dot"); d.style.background = c; s.append(d, t); lg.append(s); };
  sw(REV, "売上（通常営業）"); sw(RENT, "売上（レンタル）");
  if (st.cost) { CATS.forEach((c) => sw(c.color, c.name)); lg.append(el("span", "", "下の数字は利益（灰色はレンタルが月次確定前の参考値、— は費用の記録がそろわない月）")); }
  box.append(lg);
  const d = el("details", "tbl"), tw = el("div", "tablewrap"), t = el("table", "rtable");
  d.append(el("summary", "", "表で見る"));
  t.innerHTML = `<thead><tr><th>月</th><th class="n">売上合計</th><th class="n">通常営業</th><th class="n">レンタル</th>${st.cost ? CATS.map((c) => `<th class="n">${esc(c.name)}</th>`).join("") + '<th class="n">コスト合計</th><th class="n">利益</th>' : ""}</tr></thead><tbody>` +
    months.slice().reverse().map((M) => `<tr><td>${esc(mLabel(M.m))}</td><td class="n num">${yen(M.revenue)}</td><td class="n num">${yen(M.sales)}</td><td class="n num">${M.c.rent.s === "ok" ? yen(M.rent || 0) : esc(stName("rent", M.c.rent.s))}</td>${st.cost ? CATS.map((c) => `<td class="n num">${M.c[c.key].v == null ? esc(stName(c.key, M.c[c.key].s)) : yen(M.c[c.key].v)}</td>`).join("") + `<td class="n num">${yen(M.known)}</td><td class="n num">${M.profit != null ? yen(M.profit) : M.ref != null ? "参考 " + yen(M.ref) : "—"}</td>` : ""}</tr>`).join("") + "</tbody>";
  tw.append(t); d.append(tw); box.append(d);
}

/* 2. 損益（滝グラフ）: 売上合計から費目を順に引いて、残りが利益。棒に触れると詳細（前月との差、各画面へのリンク） */
function waterfall(M, P, isCur) {
  const title = isCur ? `${mShort(M.m)}のここまでの損益` : `${mShort(M.m)}の損益`;
  const cap = isCur ? "今日までの売上合計から、費用を順に引いた残り（固定費は月額をまるごと引いています）" : "売上合計から費用を順に引き、残りが利益（損失）";
  const foot = [["変動費の内訳を見る", "#cost-var"], ["固定費を見る", "#cost-fixed"]];
  if (M.revenue == null || M.known == null) {
    const msg = M.revenue == null ? emptyMsg(st.L) : CATS.every((c) => M.c[c.key].s === "error") ? "費用を読み込めませんでした。" : "読み込み中です。";
    return widget({ title, cap, action: ["コスト管理を開く", "#cost"], body: [el("p", "empty", msg)], foot });
  }
  const steps = [{ key: "rev", name: "売上合計", v: M.revenue, color: REV, kind: "total", route: "#sales" }];
  CATS.forEach((c) => { const x = M.c[c.key]; steps.push({ key: c.key, name: c.name, v: x.v, color: c.color, kind: "cost", s: x.s, route: c.route }); });
  // 残りは費用がそろった月だけ出す（レンタルだけ未確定なら参考値）。費用が欠けた月は — （大きく出て誤解を招くため。契約 §1b）
  const profit = M.complete ? M.revenue - M.known : null, sure = M.profit != null;
  steps.push({ key: "res", name: !M.complete ? (isCur ? "ここまで" : "残り") : !sure ? (isCur ? "ここまで（参考）" : "残り（参考）") : isCur ? "ここまで" : profit >= 0 ? "利益" : "損失", v: profit, color: profit >= 0 ? "var(--green)" : "var(--red)", kind: "result", route: "#cost" });
  let run = M.revenue; const lo = [], hi = [];
  steps.forEach((s) => {
    if (s.kind === "total") { s.a = 0; s.b = s.v; }
    else if (s.kind === "cost") { s.a = run - (s.v || 0); s.b = run; run -= (s.v || 0); }
    else { s.a = Math.min(0, s.v || 0); s.b = Math.max(0, s.v || 0); }
    lo.push(s.a); hi.push(s.b);
  });
  const W = 600, H = 260, L = 50, R = 8, T = 22, B = 40, iw = W - L - R, ih = H - T - B;
  const mn = Math.min(0, ...lo), mx = Math.max(1, ...hi);
  const y = (v) => T + (mx - v) / (mx - mn) * ih, slot = iw / steps.length, bw = Math.min(60, slot * .7);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4, yy = y(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${man(v)}</text>`; }
  g += `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  steps.forEach((s, i) => {
    const x = L + slot * i + (slot - bw) / 2, top = y(s.b), h = Math.max(1, y(s.a) - y(s.b)), na = s.v == null;
    if (i < steps.length - 1 && s.kind !== "result") { const ny = s.kind === "total" ? y(s.b) : y(s.a); g += `<line class="conn" x1="${x + bw}" x2="${x + slot}" y1="${ny}" y2="${ny}"/>`; }
    g += `<g class="hit" data-i="${i}" aria-label="${esc(s.name)}の詳細"><rect class="bg" x="${L + slot * i + 2}" y="${T}" width="${slot - 4}" height="${ih}" fill="transparent"/>`;
    g += `<rect x="${x}" y="${na ? y(s.b) - 1 : top}" width="${bw}" height="${na ? 2 : h}" fill="${s.color}"${na || (s.kind === "result" && !sure) ? ' opacity=".45"' : ""}/>`;
    const lab = na ? stName(s.key, s.s) : (s.kind === "cost" ? `−${man(s.v)}` : man(s.v));
    g += `<text class="lab" x="${x + bw / 2}" y="${(s.kind === "result" && s.v < 0 ? y(s.a) + 14 : top - 6)}" text-anchor="middle">${esc(lab)}</text>`;
    g += `<text x="${x + bw / 2}" y="${H - 22}" text-anchor="middle">${esc(s.name)}</text>`;
    if (s.kind === "cost" && !na && M.revenue) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${pc(s.v / M.revenue)}</text>`;
    g += "</g>";
  });
  const box = el("div"); box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(mLabel(M.m))}の損益の内訳">${g}</svg>`;
  // ポップアップ: 金額（その画面へのリンク）・売上合計に対する割合・前月との差（今月は途中なので差を出さず、前月の1か月分だけ）
  const prevOf = (s) => s.key === "rev" ? P.revenue : s.key === "res" ? (P.complete ? P.revenue - P.known : null) : P.c[s.key] ? P.c[s.key].v : null;
  box.querySelectorAll("g.hit").forEach((n) => {
    const s = steps[+n.dataset.i];
    attachPop(n, "wf", s.key, () => {
      const pv = prevOf(s), rows = [[s.kind === "cost" ? "金額" : s.name, s.v == null ? stName(s.key, s.s) : yen(s.v), s.route, { tot: true, cls: s.kind === "result" && s.v != null ? (s.v >= 0 ? "pos" : "neg") : s.v == null ? "na" : "" }]];
      if (s.kind === "total") rows.push(["通常営業", yen(M.sales), "#sales", { color: REV }], ["レンタル", M.c.rent.s === "ok" ? yen(M.rent || 0) : "未確定", "#sales", { color: RENT }]);
      if (s.kind !== "total" && s.v != null && M.revenue) rows.push(["売上合計に対する割合", pc(s.v / M.revenue)]);
      if (s.kind === "result") rows.push(["売上合計", yen(M.revenue), "#sales"], ["コスト合計", yen(M.known), "#cost"]);
      if (pv != null && s.v != null) rows.push("sep", ...prevRows(s.v, pv, P.m, isCur, s.kind === "cost"));
      return popBody(`${mShort(M.m)}・${s.name}`, rows, s.route ? "金額を押すと、その画面を開きます" : "");
    });
  });
  const notes = [];
  if (!M.complete) notes.push(`記録がそろっていない費目があるため、残りは出していません${M.c.rent.s !== "ok" ? "（レンタルも月次確定前）" : ""}。灰色の細い線が未記録の費目です。`);
  else if (!sure) notes.push("レンタルが月次確定前のため、残りは参考値です。");
  if (M.est) notes.push("人件費は給与の見込み（その日時点の額）です。");
  if (isCur && M.fixed != null && profit != null) {   // 売上管理は固定費を日割りで引く。差が分かるように、日割りの参考値を添える
    const day = +todayBiz().slice(8, 10), dim = daysIn(M.m), fxDay = M.fixed * day / dim;
    notes.push(`固定費を今日までの日割り（${day}/${dim}日）にすると ${yen(fxDay)}、残りは ${yen(profit + M.fixed - fxDay)}（売上管理の利益と同じ考え方）。`);
  }
  notes.push("棒に触れると、前月との差と各画面へのリンクが出ます。費目の下の % は売上合計に対する割合。");
  return widget({ title, cap, action: ["コスト管理を開く", "#cost"], chart: true, body: [box, el("p", "note", notes.join(""))], foot });
}

/* 3. 損益分岐までの距離: 損益分岐売上 ＝ 固定費 ÷ (1 − 変動費率)。今月は済んだ日のペースで月末の売上を見込む */
function breakEven(M, isCur, today) {
  const foot = [["固定費を見る", "#cost-fixed"], ["変動費を見る", "#cost-var"]];
  const base = { title: "損益分岐までの距離", action: ["コスト管理を開く", "#cost"], foot };
  const varOK = BN.ledger.VAR.every((k) => ["ok", "est"].includes(M.c[k].s));
  const rate = varOK && M.revenue ? M.varKnown / M.revenue : null;
  const be = M.fixed != null && rate != null && rate < 1 ? M.fixed / (1 - rate) : null;
  if (be == null) {
    const msg = M.fixed == null ? `固定費が${stName("fixed", M.c.fixed.s)}のため出せません。` : M.revenue === 0 ? "この月の売上がまだありません。"
      : M.revenue == null ? emptyMsg(st.L) : rate != null && rate >= 1 ? "変動費が売上合計を上回っているため、売上を増やしても黒字になりません。" : "変動費の記録がそろうと出します。";
    return widget({ ...base, cap: "損益分岐売上 ＝ 固定費 ÷（1 − 変動費率）", body: [el("p", "empty", msg)] });
  }
  const dim = daysIn(M.m), done = doneDays(M.m, today);
  // 月末の見込み: 今日の伝票は途中なので、昨日までの通常営業の売上でペースを出し、レンタルの確定値は伸ばさない
  const pace = isCur && done >= 2 && M.sales != null ? salesUpTo(M.m, done) / done * dim + (M.rent || 0) : null;
  const gap = be - M.revenue, left = dim - done;
  const body = [el("div", "be-big num " + (gap <= 0 ? "pos" : ""), gap <= 0 ? `損益分岐を ${yen(-gap)} 上回っています` : `損益分岐まで あと ${yen(gap)}`)];
  const sub = [];
  if (isCur && gap > 0 && left > 0) sub.push(`今日を含む残り${left}日で、1日あたり ${yen(gap / left)} の売上が必要です`);
  if (pace != null) sub.push(`昨日までのペースなら、月末の売上合計は ${yen(pace)}（損益分岐の ${pc(pace / be)}）`);
  if (sub.length) body.push(el("div", "be-sub", sub.join("。") + "。"));
  const top = Math.max(be, M.revenue, pace || 0) * 1.08, w = (v) => `${Math.max(0, Math.min(100, v / top * 100))}%`;
  const tr = el("div", "be-track"), fill = el("i", "be-fill"); fill.style.width = w(M.revenue); fill.title = `売上合計 ${yen(M.revenue)}`; tr.append(fill);
  if (pace != null && pace > M.revenue) { const p = el("i", "be-pace"); p.style.left = w(M.revenue); p.style.width = `calc(${w(pace)} - ${w(M.revenue)})`; p.title = `月末の見込み ${yen(pace)}`; tr.append(p); }
  const mk = el("div", "be-mark"), pos = be / top; mk.style.left = w(be); if (pos > .8) mk.classList.add("edge-r"); else if (pos < .2) mk.classList.add("edge-l");
  mk.append(el("span", "", `損益分岐 ${man(be)}`)); tr.append(mk);
  tr.setAttribute("aria-label", `売上合計 ${yen(M.revenue)}、損益分岐売上 ${yen(be)}${pace != null ? `、月末の見込み ${yen(pace)}` : ""}`);
  // 帯に触れると、内訳（売上・損益分岐・見込み・固定費）
  const pay = M.c.fixed.f.items.filter((i) => i.category === "返済・配当").reduce((x, i) => x + i.monthly, 0);
  attachPop(tr, "be", M.m, () => popBody("損益分岐の内訳", [["売上合計", yen(M.revenue), "#sales", { color: REV }], ["損益分岐売上", yen(be), "#cost", { tot: true }],
    ...(pace != null ? [["月末の見込み", yen(pace), "#sales"]] : []), "sep", ["固定費（月額）", yen(M.fixed), "#cost-fixed", { color: "var(--c-fixed)" }],
    ...(pay ? [["うち返済・配当", yen(pay), "#cost-fixed"]] : []), ["変動費", yen(M.varKnown), "#cost-var"], ["変動費率", pc(rate)]], "金額を押すと、その画面を開きます"));
  const ax = el("div", "be-axis"); ax.append(el("span", "", "¥0"), el("span", "", man(top)));
  body.push(tr, ax);
  // 固定費には返済・配当（出資者配当金・銀行借入の返済）を含む（§3c）。会計上の費用だけの損益分岐も並べる
  const kvb = el("div", "kv");
  [["売上合計", yen(M.revenue)], ["損益分岐売上", yen(be)], ["変動費率", pc(rate)], ["固定費（月額・返済・配当を含む）", yen(M.fixed)],
   ...(pay ? [["返済・配当を除いた損益分岐", yen((M.fixed - pay) / (1 - rate))]] : [])].forEach(([a, b]) => { const d = el("div"); d.append(el("span", "", a), el("b", "num", b)); kvb.append(d); });
  body.push(kvb);
  if (isCur && M.c.rent.s !== "ok") body.push(el("p", "note", "レンタルの店舗収益は月次確定後に入るため、今月の売上合計にはまだ含まれていません。"));
  return widget({ ...base, cap: isCur ? "今月の売上合計と損益分岐売上（月の合計）。破線は昨日までのペースで見込んだ月末の売上" : `${mLabel(M.m)}の売上合計と損益分岐売上`, body });
}

/* 4. 構成比（円グラフ）: コストの内訳（閲覧だけの人は売上の内訳）。扇に触れると金額・割合・前月、名前と金額は各画面へのリンク */
function donut(M, P) {
  const parts = st.cost
    ? CATS.map((c) => ({ key: c.key, name: c.name, color: c.color, route: c.route, v: M.c[c.key].v, s: M.c[c.key].s, pv: P.c[c.key] ? P.c[c.key].v : null }))
    : [{ key: "sales", name: "通常営業", color: REV, route: "#sales", v: M.sales, pv: P.sales }, { key: "rent", name: "レンタル", color: RENT, route: "#sales", v: M.c.rent.s === "ok" ? (M.rent || 0) : null, s: M.c.rent.s, pv: P.c.rent.s === "ok" ? (P.rent || 0) : null }];
  const title = st.cost ? `${mShort(M.m)}のコストの内訳` : `${mShort(M.m)}の売上の内訳`;
  const base = { title, cap: st.cost ? "コスト合計に占める割合（記録済みの費目）。扇に触れると金額と前月" : "売上合計に占める割合。扇に触れると金額と前月", action: st.cost ? ["コスト管理を開く", "#cost"] : ["売上管理を開く", "#sales"],
    foot: st.cost ? [["変動費の内訳を見る", "#cost-var"], ["固定費を見る", "#cost-fixed"]] : [["売上管理を開く", "#sales"]] };
  const pos = parts.filter((p) => p.v > 0), total = pos.reduce((x, p) => x + p.v, 0);
  if (!total) return widget({ ...base, body: [el("p", "empty", M.revenue == null ? emptyMsg(st.L) : "この月の記録がまだありません。")] });
  const R = 76, C = 2 * Math.PI * R, SW = 28;
  let off = 0, segs = "";
  pos.forEach((p, i) => {
    const len = p.v / total * C, gap = pos.length > 1 ? Math.min(2, len / 3) : 0;
    segs += `<circle class="seg hit" data-i="${parts.indexOf(p)}" cx="100" cy="100" r="${R}" fill="none" stroke="${p.color}" stroke-width="${SW}" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" aria-label="${esc(p.name)} ${pc(p.v / total)}"/>`;
    off += len;
  });
  const wrap = el("div", "dn"), fig = el("div");
  fig.innerHTML = `<svg viewBox="0 0 200 200" role="group" aria-label="${esc(title)}">${segs}<text class="c1" x="100" y="94" text-anchor="middle">${st.cost ? "コスト合計" : "売上合計"}</text><text class="c2" x="100" y="116" text-anchor="middle">${esc(man(st.cost && M.known != null ? M.known : total))}</text></svg>`;
  const popOf = (p) => () => {
    const rows = [["金額", p.v == null ? stName(p.key, p.s) : yen(p.v), p.route, { tot: true, color: p.color }], ["構成比", pc(p.v / total)]];
    if (st.cost && M.revenue) rows.push(["売上合計に対する割合", pc(p.v / M.revenue)]);
    if (p.pv != null && p.v != null) rows.push("sep", ...prevRows(p.v, p.pv, P.m, M.m === todayBiz().slice(0, 7), st.cost));
    return popBody(`${mShort(M.m)}・${p.name}`, rows, "金額を押すと、その画面を開きます");
  };
  fig.querySelectorAll(".seg").forEach((n) => { const p = parts[+n.dataset.i]; attachPop(n, "dn", p.key, popOf(p)); });
  // 凡例（名前と金額は各画面へのリンク）
  const ul = el("ul", "dn-list");
  parts.forEach((p) => {
    const li = el("li"), i = el("i"); i.style.background = p.color;
    li.append(i, link(p.route, p.name), p.v == null ? el("span", "v", stName(p.key, p.s)) : link(p.route, yen(p.v), "v"), el("span", "p", p.v > 0 ? pc(p.v / total) : "—"));
    ul.append(li);
  });
  wrap.append(fig, ul);
  const body = [wrap];
  if (st.cost && !M.complete) body.push(el("p", "note", "記録がそろっていない費目は含めていません（割合は記録済みの費目の中での割合です）。"));
  if (!st.cost && M.c.rent.s !== "ok") body.push(el("p", "note", "レンタルは月次確定前のため含めていません。"));
  return widget({ ...base, chart: true, body });
}

/* 5. 曜日ごとの平均売上（直近12週。今日は途中なので除く。伝票のあった日だけの平均。いちばん高い曜日を色で） */
function weekday(today) {
  const base = { title: "曜日ごとの平均売上", cap: "直近12週（昨日まで）・通常営業・伝票のあった日の平均。棒に触れると詳細", action: ["売上管理を開く", "#sales"], chart: true, foot: [["売上管理で期間ごとに見る", "#sales"]] };
  const d = st.L.daily;
  if (!d) return widget({ ...base, body: [el("p", "empty", emptyMsg(st.L))] });
  const names = ["月", "火", "水", "木", "金", "土", "日"], sum = Array(7).fill(0), cnt = Array(7).fill(0), hi = Array(7).fill(null);
  const end = Date.parse(today + "T00:00:00Z");
  for (let i = 1; i <= 84; i++) {
    const t = new Date(end - i * 864e5), key = t.toISOString().slice(0, 10), x = d[key]; if (!x) continue;
    const wd = (t.getUTCDay() + 6) % 7; sum[wd] += x.sales; cnt[wd]++;
    if (!hi[wd] || x.sales > hi[wd].v) hi[wd] = { v: x.sales, d: key };
  }
  const avg = sum.map((s, i) => cnt[i] ? s / cnt[i] : null), best = avg.reduce((b, v, i) => v != null && (b < 0 || v > avg[b]) ? i : b, -1);
  if (best < 0) return widget({ ...base, body: [el("p", "empty", "直近12週に伝票がありません。")] });
  const W = 520, H = 210, L = 50, R = 8, T = 22, B = 40, iw = W - L - R, ih = H - T - B, mx = Math.max(...avg.filter((v) => v != null));
  const y = (v) => T + ih - v / mx * ih, slot = iw / 7, bw = Math.min(52, slot * .68);
  let g = `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  avg.forEach((v, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    g += `<g class="hit" data-i="${i}" aria-label="${names[i]}曜の詳細"><rect class="bg" x="${L + slot * i + 2}" y="${T}" width="${slot - 4}" height="${ih}" fill="transparent"/>`;
    if (v != null) g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${ih + T - y(v)}" fill="${i === best ? REV : "var(--bar)"}"/><text class="${i === best ? "lab" : ""}" x="${x + bw / 2}" y="${y(v) - 6}" text-anchor="middle">${man(v)}</text>`;
    g += `<text x="${x + bw / 2}" y="${H - 22}" text-anchor="middle"${i === best ? ' class="lab"' : ""}>${names[i]}</text><text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${cnt[i]}日</text></g>`;
  });
  const wrap = el("div"); wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="曜日ごとの平均売上">${g}</svg>`;
  wrap.querySelectorAll("g.hit").forEach((n) => {
    const i = +n.dataset.i;
    attachPop(n, "wd", i, () => popBody(`${names[i]}曜（直近12週）`, [["平均の売上", yen(avg[i]), "#sales", { tot: true }], ["伝票のあった日", `${cnt[i]}日`], ["合計", yen(sum[i]), "#sales"],
      ...(hi[i] ? [["いちばん高かった日", `${md(hi[i].d)} ${yen(hi[i].v)}`, "#sales"]] : [])], "金額を押すと、売上管理を開きます"));
  });
  return widget({ ...base, body: [wrap, el("p", "note", `いちばん高いのは${names[best]}曜（平均 ${yen(avg[best])}）。下の数字は、直近12週で伝票のあった日数。`)] });
}

/* 6. データの状態（AWS の StatusIndicator のように、印と色で）。名前は緑字のリンクで、その画面へ */
function health(M, today) {
  const ul = el("ul", "health"), L = st.L;
  const row = (name, href, kind, text, sub) => {
    const li = el("li"), s = el("span", "st " + kind), i = el("i", "", { ok: "✓", warn: "!", err: "×", wait: "…" }[kind]);
    const t = el("span", "", text); if (sub) t.append(el("small", "", sub));
    s.append(i, t); li.append(href ? link(href, name) : el("span", "nm plain", name), s); ul.append(li);
  };
  if (st.mcp === null) row("Asana", null, "err", "つながっていません");
  else {
    if (L.error) row("伝票（売上）", "#sales", "err", "読めませんでした");
    else if (!L.slips) row("伝票（売上）", "#sales", "wait", "読み込み中");
    else { const ago = L.lastSlip ? BN.dayDiff(L.lastSlip, today) : null; row("伝票（売上）", "#sales", ago == null || ago >= 4 ? "warn" : "ok", L.lastSlip ? `最後の伝票 ${md(L.lastSlip)}（${ago === 0 ? "今日" : ago + "日前"}）` : "伝票がありません", ago >= 4 ? "4日以上入っていません" : ""); }
    if (L.rentals) { const ms = Object.keys(L.rentals).sort(); row("レンタル", "#sales", ms.length ? "ok" : "warn", ms.length ? `確定は ${mLabel(ms[ms.length - 1])} まで` : "月次確定値がありません", "店舗収益（振込額）の月次確定値"); }
    if (st.cost) {
      const kindOf = (s) => ({ ok: "ok", est: "ok", partial: "warn", none: "warn", wait: "wait", error: "err", off: "wait" }[s] || "wait");
      const lab = M.c.labor; row("給与（人件費）", "#cost-staff", kindOf(lab.s), `${mShort(M.m)}：${stName("labor", lab.s)}`, lab.s === "none" ? "給与の記録が無い月は利益を出しません" : lab.s === "est" ? "計算日の前はその日時点の見込み" : "");
      const lastTxt = (k) => L[k + "Last"] ? `記録は ${md(L[k + "Last"])} まで` : "記録がありません";
      const pur = M.c.purchase; row("仕入", "#cost-purchase", kindOf(pur.s), `${mShort(M.m)}：${stName("purchase", pur.s)}`, L.purchaseState === "ok" ? lastTxt("purchase") + "（週1回の取り込み）" : "");
      const sup = M.c.supplies; row("備品・消耗品", "#cost-supplies", kindOf(sup.s), `${mShort(M.m)}：${stName("supplies", sup.s)}`, L.suppliesState === "ok" ? lastTxt("supplies") + "（カード明細は1〜2日遅れ）" : "");
      const fx = M.c.fixed; row("固定費", "#cost-fixed", kindOf(fx.s), fx.s === "ok" ? `${mShort(M.m)}：${fx.f.items.length}項目・${yen(fx.v)}` : `${mShort(M.m)}：${stName("fixed", fx.s)}`);
    }
  }
  return widget({ full: true, title: "データの状態", cap: "数字の元になる記録が、いつまで入っているか。名前を押すとその画面を開きます", body: [ul] });
}

/* ---------- 操作 ---------- */
$("hm-prev").addEventListener("click", () => { st.month = addM(st.month, -1); st.pin = null; render(); });
$("hm-next").addEventListener("click", () => { if (st.month < todayBiz().slice(0, 7)) { st.month = addM(st.month, 1); st.pin = null; render(); } });
const pageBox = $("hm-root").closest(".page");
const visible = () => !pageBox || !pageBox.hidden;
window.addEventListener("portal:route", (e) => {
  if (!e.detail || e.detail.key !== "home") { hidePop(true); return; }   // ほかの画面へ移ったら閉じる（リンクで移ったとき）
  if (st.version !== BN.version() || st.env !== BN.env.get() || st.loadedCost !== canCost()) load();
});
window.addEventListener("portal:env", () => { if (visible()) load(); else { BN.gen("home"); st.version = -1; } });
window.addEventListener("portal:access", () => { if (visible()) load(); else st.version = -1; });
// 横幅が変わったら描き直す（12か月のグラフの幅を合わせる）。スマホのアドレスバーの出し入れ（高さだけの変化）では描き直さない
let lastW = window.innerWidth, rz = 0;
window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => { if (visible()) render(); }, 200); });
// module の script は殻の portal:route より後に動くことがあるので、最初の読み込みはここで始める
if (document.documentElement.dataset.route === "home" && st.version === -1) load();
</script>
